# Supabase pauses free-tier projects after 7 days without activity.
# This runs a tiny read query twice a week so the project stays awake.
name: Supabase keep-alive

on:
  schedule:
    # Mondays and Thursdays at 12:00 UTC (09:00 in Argentina).
    - cron: "0 12 * * 1,4"
  # Allows running it by hand from the Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # RLS returns no rows to the anon key, but the query still runs in
          # Postgres, which is what counts as activity.
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/restaurant?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase respondió OK."
